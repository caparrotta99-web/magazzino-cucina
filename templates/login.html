<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Accedi — Brigade</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>

<div class="aurora-bg" aria-hidden="true"></div>

<div class="auth-wrap">
  <div class="card auth-card">
    <div class="auth-logo"><img src="/static/icon.svg" alt="Brigade">Brigade</div>
    <h1>Accedi</h1>
    <p class="sub">Inserisci nome, cognome e password</p>

    {% if error %}
    <div class="msg-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" autocomplete="on">
      <div class="form-group">
        <label>Nome e Cognome</label>
        <input type="text" name="nome" placeholder="es. Mario Rossi" required
               autocomplete="name" autofocus autocapitalize="words">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required
               autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">Accedi</button>
    </form>

    <div class="footer-link">
      Non hai un account? <a href="/register">Registrati</a>
    </div>
  </div>
</div>

</body>
</html>
