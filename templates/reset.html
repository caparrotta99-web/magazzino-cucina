<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Reimposta password — Brigade</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>

<div class="aurora-bg" aria-hidden="true"></div>

<div class="auth-wrap">
  <div class="card auth-card">
    <div class="auth-logo"><img src="/static/icon.svg" alt="Brigade">Brigade</div>

      <h1>Nuova password</h1>
      <p class="sub">Ciao {{ nome }}, l'amministratore ti ha fatto entrare. Scegli una nuova password.</p>

      {% if error %}
      <div class="msg-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/reset-password" autocomplete="on">
        <div class="form-group">
          <label>Nuova password</label>
          <input type="password" name="password" placeholder="Minimo 6 caratteri"
                 required autofocus autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>Conferma password</label>
          <input type="password" name="password2" placeholder="Ripeti la password"
                 required autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary">Salva ed entra</button>
      </form>
  </div>
</div>

</body>
</html>
