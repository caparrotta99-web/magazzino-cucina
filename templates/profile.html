<!DOCTYPE html>
<html lang="it" data-theme="{{ 'dark' if (current_user.is_authenticated and current_user.tema == 'scuro') else 'light' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="{{ '#0f2c35' if (current_user.is_authenticated and current_user.tema == 'scuro') else '#ffffff' }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Il mio profilo — Brigade</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
<style>
.avatar-row { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
.avatar-name { font-size: 18px; font-weight: 700; color: var(--text); }
.avatar-role { margin-top: 5px; }
</style>
</head>
<body>

<div class="aurora-bg" aria-hidden="true"></div>

<header class="aux-header">
  <a href="/" class="btn-back">← App</a>
  <div class="aux-logo"><img src="/static/icon.svg" alt="Brigade">Brigade</div>
</header>

<main class="aux-main">

  <div class="avatar-row">
    <div class="avatar">{{ user.nome[0]|upper }}</div>
    <div>
      <div class="avatar-name">{{ user.nome }}</div>
      <span class="badge avatar-role badge-{{ 'admin' if user.role == 'admin' else 'staff' }}">{{ user.role }}</span>
    </div>
  </div>

  {% if success %}
  <div class="msg-success">✓ {{ success }}</div>
  {% endif %}
  {% if error %}
  <div class="msg-error">{{ error }}</div>
  {% endif %}

  <div class="card">
    <form method="post" action="/profile">

      <!-- ── DATI PERSONALI ── -->
      <div class="section-title">Dati personali</div>

      <div class="form-group">
        <label>Nome e Cognome</label>
        <input type="text" name="nome" value="{{ user.nome }}" required autocomplete="name">
      </div>

      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" value="{{ user.username or '' }}" required
               autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      </div>

      <!-- ── DASHBOARD ── -->
      <div class="section-title">Dashboard</div>

      <div class="form-group">
        <label>Card personalizzabile</label>
        <select name="home_card">
          <option value="nessuna"     {{ 'selected' if user.home_card == 'nessuna' }}>Nessuna</option>
          <option value="preparazioni" {{ 'selected' if not user.home_card or user.home_card == 'preparazioni' }}>Preparazioni in corso</option>
          <option value="apparecchi"  {{ 'selected' if user.home_card == 'apparecchi' }}>Apparecchi da controllare</option>
          {% if current_user.puo_gestire_sala %}
          <option value="prenotazioni" {{ 'selected' if user.home_card == 'prenotazioni' }}>Prenotazioni di oggi</option>
          {% endif %}
        </select>
        <span class="hint">Cosa mostrare nella card personalizzabile della dashboard</span>
      </div>

      <!-- ── CAMBIO PASSWORD ── -->
      <div class="section-title">Cambia password <span style="font-size:10px;font-weight:400;text-transform:none;letter-spacing:0">(opzionale — lascia vuoto per non cambiare)</span></div>

      <div class="form-group">
        <label>Password attuale</label>
        <input type="password" name="current_password"
               placeholder="richiesta solo per cambiare la password"
               autocomplete="current-password">
      </div>

      <div class="form-group">
        <label>Nuova password</label>
        <input type="password" name="new_password"
               placeholder="minimo 6 caratteri"
               autocomplete="new-password">
      </div>

      <div class="form-group">
        <label>Conferma nuova password</label>
        <input type="password" name="new_password2"
               placeholder="ripeti la nuova password"
               autocomplete="new-password">
      </div>

      <button type="submit" class="btn-primary">Salva modifiche</button>

    </form>
  </div>

</main>

</body>
</html>
